; ============================================================
;  UniProto — PlatformIO project configuration
;  One [env] per physical setup.
;  Build:    pio run -e psd_distance
;  Upload:   pio run -e psd_distance -t upload
;  Monitor:  pio device monitor -e psd_distance
; ============================================================

[platformio]
; All firmware lives in src/<name>/ — one folder per setup.
; Each [env] picks its folder with  build_src_filter = -<*> +<name/>
src_dir = src

; ============================================================
;  Shared defaults
; ============================================================
[common]
build_flags_base =
  -DUNIPROTO_MAX_STREAMS=12
  -DUNIPROTO_MAX_ACTIONS=8
  -DUNIPROTO_MAX_PARAMS=32

[env]
framework     = arduino
monitor_speed = 115200
build_flags   = ${common.build_flags_base}

; Exclude everything except what each env explicitly adds.
; (lib/, readers/, dashboard/ … are outside src_dir, so they are never compiled.)
build_src_filter =
  -<*>

; ============================================================
;  1. BLDC motor — 50 Hz servo PWM, no feedback
; ============================================================
[env:bldc_servo]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<bldc_servo/>

; ============================================================
;  2. Pneumatic — pump + valve + Honeywell pressure + HX711
; ============================================================
[env:pneumatic]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<pneumatic/>

; ============================================================
;  3. Stepper — MKS SERVO42D closed-loop controller
; ============================================================
[env:stepper]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<stepper/>

; ============================================================
;  4. Load cell — HX711 amplifier
; ============================================================
[env:load_cell]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<load_cell/>

; ============================================================
;  5. Sharp 2Y0A710 PSD distance sensor
; ============================================================
[env:psd_distance]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<psd_distance/>

; ============================================================
;  6. DC motor — 1:30 geared, 200 PPR encoder, Arduino Motor Shield
; ============================================================
[env:dc_motor]
platform    = atmelavr
board       = uno
build_flags =
  -DUNIPROTO_MAX_STREAMS=12
  -DUNIPROTO_MAX_ACTIONS=8
  -DUNIPROTO_MAX_PARAMS=40
build_src_filter = -<*> +<dc_motor/>

; ============================================================
;  7. Haptic master-slave — two Maxon motors + L293
; ============================================================
[env:haptic]
platform    = atmelavr
board       = uno
build_flags =
  -DUNIPROTO_MAX_STREAMS=12
  -DUNIPROTO_MAX_ACTIONS=8
  -DUNIPROTO_MAX_PARAMS=40
build_src_filter = -<*> +<haptic/>

; ============================================================
;  8. A2610 optical mouse sensor
; ============================================================
[env:optical_mouse]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<optical_mouse/>

; ============================================================
;  9. LVDT — PWM AC out, filtered AC in
; ============================================================
[env:lvdt]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<lvdt/>

; ============================================================
; 10. Sensor shield — INA122, Hall+encoder, cap slider, RC-ADC, US
; ============================================================
[env:sensor_shield]
platform    = atmelavr
board       = uno
lib_deps    = paulstoffregen/CapacitiveSensor@^0.5.1
build_flags =
  -DUNIPROTO_MAX_STREAMS=12
  -DUNIPROTO_MAX_ACTIONS=8
  -DUNIPROTO_MAX_PARAMS=40
build_src_filter = -<*> +<sensor_shield/>

; ============================================================
; 11. BLDC gimbal — DRV8313 driver + AS5600 encoder
; ============================================================
[env:bldc_gimbal]
platform    = atmelavr
board       = uno
build_flags =
  -DUNIPROTO_MAX_STREAMS=4
  -DUNIPROTO_MAX_ACTIONS=2
  -DUNIPROTO_MAX_PARAMS=16
build_src_filter = -<*> +<bldc_gimbal/>

; ============================================================
; 12. QTR-8 optical reflection array
; ============================================================
[env:qtr8]
platform    = atmelavr
board       = diecimilaatmega328
build_flags =
  -DUNIPROTO_MAX_STREAMS=4
  -DUNIPROTO_MAX_ACTIONS=8
  -DUNIPROTO_MAX_PARAMS=32
build_src_filter = -<*> +<qtr8/>

; ============================================================
; 13. Grove biosensors — GSR + ear-clip heart rate
; ============================================================
[env:biosensors]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<biosensors/>

; ============================================================
; 14. Wind speed — IR optical gate anemometer
; ============================================================
[env:wind_speed]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<wind_speed/>

; ============================================================
; 15. Piezo ×4 + MIDIUSB — Arduino Leonardo
; ============================================================
[env:piezo_midi]
platform = atmelavr
board    = leonardo
lib_deps = arduino-libraries/MIDIUSB
build_src_filter = -<*> +<piezo_midi/>

; ============================================================
; 15b. Piezo ×4 serial — UniProto streaming (Leonardo)
; ============================================================
[env:piezo_serial]
platform = atmelavr
board    = leonardo
build_src_filter = -<*> +<piezo_serial/>

; ============================================================
; 16. Variable capacitor — 10 MΩ RC cap-sense
;     Board: Arduino Duemilanove with ATmega168 (14KB flash, 1KB RAM)
; ============================================================
[env:cap_sense]
platform = atmelavr
board    = diecimilaatmega168
build_flags =
  -DUNIPROTO_MAX_STREAMS=4
  -DUNIPROTO_MAX_ACTIONS=2
  -DUNIPROTO_MAX_PARAMS=8
build_src_filter = -<*> +<cap_sense/>

; ============================================================
; 17. Kitchen scales — load cell + HX711
; ============================================================
[env:kitchen_scales]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<kitchen_scales/>

; ============================================================
; 18. HC-SR04 ultrasonic distance
; ============================================================
[env:us_distance]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<us_distance/>

; ============================================================
; 19. MMA7260 accelerometer — analog X/Y/Z
; ============================================================
[env:accelerometer]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<accelerometer/>

; ============================================================
; 20. Synchro transformer — 3-phase PWM, filtered sine
; ============================================================
[env:synchro]
platform = atmelavr
board    = uno
build_flags =
  -DUNIPROTO_MAX_STREAMS=4
  -DUNIPROTO_MAX_ACTIONS=2
  -DUNIPROTO_MAX_PARAMS=8
build_src_filter = -<*> +<synchro/>

; ============================================================
; 21. Wiimote IR camera — I2C @ 400 kHz
; ============================================================
[env:wiimote]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<wiimote/>
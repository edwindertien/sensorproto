; ============================================================
;  UniProto — PlatformIO project configuration
;  One [env] per physical setup.
;  Build:    pio run -e psd_distance
;  Upload:   pio run -e psd_distance -t upload
;  Monitor:  pio device monitor -e psd_distance
; ============================================================

[platformio]
; Set project root as the source root so build_src_filter patterns
; match src_<name>/ folders directly.
src_dir = .

; ============================================================
;  Shared defaults
; ============================================================
[common]
build_flags_base =
  -DUNIPROTO_MAX_STREAMS=12
  -DUNIPROTO_MAX_ACTIONS=8
  -DUNIPROTO_MAX_PARAMS=32

[env]
framework     = arduino
monitor_speed = 115200
build_flags   = ${common.build_flags_base}

; Exclude everything except what each env explicitly adds.
; Also exclude lib/ and readers/ so only src_<name>/ is compiled.
build_src_filter =
  -<*>

; ============================================================
;  1. BLDC motor — 50 Hz servo PWM, no feedback
; ============================================================
[env:bldc_servo]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<src_bldc_servo/>

; ============================================================
;  2. Pneumatic — pump + valve + Honeywell pressure + HX711
; ============================================================
[env:pneumatic]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<src_pneumatic/>

; ============================================================
;  3. Stepper — MKS SERVO42D closed-loop controller
; ============================================================
[env:stepper]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<src_stepper/>

; ============================================================
;  4. Load cell — HX711 amplifier
; ============================================================
[env:load_cell]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<src_load_cell/>

; ============================================================
;  5. Sharp 2Y0A710 PSD distance sensor
; ============================================================
[env:psd_distance]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<src_psd_distance/>

; ============================================================
;  6. DC motor — 1:30 geared, 200 PPR encoder, Arduino Motor Shield
; ============================================================
[env:dc_motor]
platform    = atmelavr
board       = uno
build_flags =
  -DUNIPROTO_MAX_STREAMS=12
  -DUNIPROTO_MAX_ACTIONS=8
  -DUNIPROTO_MAX_PARAMS=40
build_src_filter = -<*> +<src_dc_motor/>

; ============================================================
;  7. Haptic master-slave — two Maxon motors + L293
; ============================================================
[env:haptic]
platform    = atmelavr
board       = uno
build_flags =
  -DUNIPROTO_MAX_STREAMS=12
  -DUNIPROTO_MAX_ACTIONS=8
  -DUNIPROTO_MAX_PARAMS=40
build_src_filter = -<*> +<src_haptic/>

; ============================================================
;  8. A2610 optical mouse sensor
; ============================================================
[env:optical_mouse]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<src_optical_mouse/>

; ============================================================
;  9. LVDT — PWM AC out, filtered AC in
; ============================================================
[env:lvdt]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<src_lvdt/>

; ============================================================
; 10. SensorShield — INA122, hall-encoder, cap slider, etc.
; ============================================================
[env:sensor_shield]
platform    = atmelavr
board       = uno
build_flags =
  -DUNIPROTO_MAX_STREAMS=12
  -DUNIPROTO_MAX_ACTIONS=8
  -DUNIPROTO_MAX_PARAMS=40 -DADC_MAX_CH=6
build_src_filter = -<*> +<src_sensor_shield/>

; ============================================================
; 11. BLDC gimbal — AS5600 + M5Stack DRV11873
; ============================================================
[env:bldc_gimbal]
platform    = atmelavr
board       = uno
build_flags =
  -DUNIPROTO_MAX_STREAMS=12
  -DUNIPROTO_MAX_ACTIONS=8
  -DUNIPROTO_MAX_PARAMS=40
build_src_filter = -<*> +<src_bldc_gimbal/>

; ============================================================
; 12. QTR-8 optical reflection array
; ============================================================
[env:qtr8]
platform    = atmelavr
board       = uno
build_flags =
  -DUNIPROTO_MAX_STREAMS=4
  -DUNIPROTO_MAX_ACTIONS=8
  -DUNIPROTO_MAX_PARAMS=32
  -DADC_MAX_CH=8
build_src_filter = -<*> +<src_qtr8/>

; ============================================================
; 13. Grove biosensors — GSR + ear-clip heart rate
; ============================================================
[env:biosensors]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<src_biosensors/>

; ============================================================
; 14. Wind speed — optical gate
; ============================================================
[env:wind_speed]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<src_wind_speed/>

; ============================================================
; 15. Piezo ×4 + MIDIUSB — Arduino Leonardo
; ============================================================
[env:piezo_midi]
platform = atmelavr
board    = leonardo
lib_deps = arduino-libraries/MIDIUSB
build_src_filter = -<*> +<src_piezo_midi/>

; ============================================================
; 16. Variable capacitor — 10 MΩ RC cap-sense
; ============================================================
[env:cap_sense]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<src_cap_sense/>

; ============================================================
; 17. Kitchen scales — load cell + HX711
; ============================================================
[env:kitchen_scales]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<src_kitchen_scales/>

; ============================================================
; 18. HC-SR04 ultrasonic distance
; ============================================================
[env:us_distance]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<src_us_distance/>

; ============================================================
; 19. MMA7260 accelerometer — analog X/Y/Z
; ============================================================
[env:accelerometer]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<src_accelerometer/>

; ============================================================
; 20. Synchro transformer — 3-phase PWM, filtered sine
; ============================================================
[env:synchro]
platform    = atmelavr
board       = uno
build_flags =
  -DUNIPROTO_MAX_STREAMS=12
  -DUNIPROTO_MAX_ACTIONS=8
  -DUNIPROTO_MAX_PARAMS=32
  -DADC_MAX_CH=6
build_src_filter = -<*> +<src_synchro/>

; ============================================================
; 21. Wiimote IR camera — I2C @ 400 kHz
; ============================================================
[env:wiimote]
platform = atmelavr
board    = uno
build_src_filter = -<*> +<src_wiimote/>
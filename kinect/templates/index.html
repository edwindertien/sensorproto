<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kinect for Xbox 360 &middot; live feed</title>
<style>
  :root{
    --bg: #14171c;
    --panel: #1b1f27;
    --grid: #2a2f3a;
    --grid-strong: #3a4152;
    --text: #e7e9ee;
    --text-dim: #7d8496;
    --accent: #5fd068;
    --ok: #5fd068;
    --bad: #ff5c5c;
  }
  *{ box-sizing:border-box; }
  html, body{
    margin:0; min-height:100%; background:var(--bg); color:var(--text);
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  body{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:20px 16px 32px; }

  header{ width:100%; max-width:1040px; display:flex; justify-content:space-between; align-items:baseline; }
  header h1{ font-size:15px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; margin:0; }
  header .model{ color:var(--text-dim); font-size:12px; }
  .status{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim); }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--bad); box-shadow:0 0 6px var(--bad); }
  .dot.live{ background:var(--ok); box-shadow:0 0 6px var(--ok); }

  .panels{ width:100%; max-width:1040px; display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .panel{
    background:var(--panel); border:1px solid var(--grid-strong); border-radius:12px;
    overflow:hidden; display:flex; flex-direction:column; position:relative;
  }
  .panel .label{
    font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim);
    padding:8px 12px; border-bottom:1px solid var(--grid);
    display:flex; justify-content:space-between; align-items:center;
  }
  .panel .label .subtoggle{ display:flex; gap:6px; }
  .panel .label .subtoggle button{
    background:transparent; border:1px solid var(--grid-strong); border-radius:4px;
    color:var(--text-dim); font-family:inherit; font-size:9px; letter-spacing:0.05em;
    text-transform:uppercase; padding:3px 7px; cursor:pointer;
  }
  .panel .label .subtoggle button.active{ color:var(--accent); border-color:var(--accent); }
  .panel img{ width:100%; display:block; aspect-ratio:4/3; object-fit:cover; background:#0d0f13; }

  .hud{ width:100%; max-width:1040px; display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .card{ background:var(--panel); border:1px solid var(--grid); border-radius:8px; padding:10px 12px; }
  .card .label{ font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); }
  .card .value{ font-size:20px; margin-top:4px; color:var(--accent); font-variant-numeric:tabular-nums; }

  @media (max-width: 720px){ .panels{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<header>
  <div>
    <h1>Kinect for Xbox 360</h1>
    <div class="model">Model 1414 &middot; libfreenect &middot; RGB + depth</div>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">connecting&hellip;</span></div>
</header>

<div class="panels">
  <div class="panel">
    <div class="label">
      <span id="videoLabelText">RGB</span>
      <span class="subtoggle">
        <button id="rgbModeBtn" class="active" title="Standard colour camera">Colour</button>
        <button id="irModeBtn" title="The IR camera and colour camera share one video channel on this hardware -- one or the other, not both at once">Raw IR</button>
      </span>
    </div>
    <img id="videoImg" src="/video_feed" alt="Camera feed" onerror="markDown()" onload="markLive()" />
  </div>
  <div class="panel">
    <div class="label">Depth</div>
    <img src="/depth_feed" alt="Depth camera feed" />
  </div>
</div>

<div class="hud">
  <div class="card"><div class="label">Frame rate</div><div class="value" id="fps">&mdash;</div></div>
  <div class="card"><div class="label">Nearest point</div><div class="value" id="nearest">&mdash;</div></div>
  <div class="card"><div class="label">Depth colour scale</div><div class="value" id="scale" style="font-size:13px;">0.4&nbsp;&ndash;&nbsp;4.0&nbsp;m</div></div>
</div>

<script>
const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');
const fpsEl = document.getElementById('fps');
const nearestEl = document.getElementById('nearest');
const rgbModeBtn = document.getElementById('rgbModeBtn');
const irModeBtn = document.getElementById('irModeBtn');
const videoLabel = document.getElementById('videoLabelText');

function markLive(){ dot.classList.add('live'); statusText.textContent = 'streaming'; }
function markDown(){ dot.classList.remove('live'); statusText.textContent = 'no signal'; }

function applyVideoMode(mode) {
  const isIr = mode === 'ir';
  rgbModeBtn.classList.toggle('active', !isIr);
  irModeBtn.classList.toggle('active', isIr);
  videoLabel.textContent = isIr ? 'Raw IR (speckle pattern)' : 'RGB';
}

async function setVideoMode(mode) {
  applyVideoMode(mode);  // optimistic; /stats will confirm shortly after
  try {
    await fetch('/set_video_mode?mode=' + mode);
  } catch (e) {
    // next pollStats() call will resync the UI if this failed silently
  }
}

rgbModeBtn.addEventListener('click', () => setVideoMode('rgb'));
irModeBtn.addEventListener('click', () => setVideoMode('ir'));

async function pollStats() {
  try {
    const res = await fetch('/stats');
    const data = await res.json();
    fpsEl.textContent = data.fps ? data.fps.toFixed(1) + ' Hz' : '—';
    nearestEl.textContent = data.nearest_mm ? (data.nearest_mm / 1000).toFixed(2) + ' m' : '—';
    if (data.video_mode) applyVideoMode(data.video_mode);

    if (data.fps > 0) {
      markLive();
    } else if (data.last_error) {
      dot.classList.remove('live');
      statusText.textContent = 'error: ' + data.last_error;
    } else if (!data.frames_received) {
      dot.classList.remove('live');
      statusText.textContent = 'waiting for first frame\u2026';
    } else {
      markDown();
    }
  } catch (e) {
    markDown();
  }
}
setInterval(pollStats, 1000);
pollStats();
</script>
</body>
</html>
